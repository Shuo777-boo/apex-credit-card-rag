[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-rag"
version = "0.1.0"
description = "Traceable credit-card policy retrieval and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pydantic==2.11.5",
  "pydantic-settings==2.9.1", "psycopg[binary,pool]==3.2.9",
  "pgvector==0.4.1", "httpx==0.28.1", "numpy==2.2.6", "PyYAML==6.0.2", "matplotlib==3.10.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.11", "mypy==1.15.0", "types-PyYAML==6.0.12.20250516", "types-psycopg2==2.9.21.20250516"]
iceberg = ["pyiceberg[sql-sqlite,pyarrow]==0.9.1", "duckdb==1.3.0", "pyarrow==19.0.1"]
graph = ["networkx==3.4.2"]
judge = []
all = ["apex-rag[iceberg,graph,judge]"]

[project.scripts]
apex-rag = "apex_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apex_rag = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real PostgreSQL + pgvector database"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/apex_rag/experiments", "src/apex_rag/graph", "src/apex_rag/extensions", "src/apex_rag/evaluation/judge", "tests/extensions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apex_rag"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["experiments/", "graph/", "extensions/", "evaluation/judge/", "tests/"]
